<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Game Instructions</title>
    <link rel="stylesheet" href="../assets/css/arrowFront.css">
</head>
<body>
    <div id="google_translate_element"></div>
    <div id="instruction-container">
        <h1>Welcome to the Arrow Game!</h1>
        <div id="instructions">
            <p>Use the bow and arrow to aim and select the correct answers. Try to hit the target with your arrow!</p>
            <p>The game will start once you press the "Start" button.</p>
        </div>

        <div id="avatar-container">
            <img id="avatar" src="../assets/images/avatar.png" alt="Instruction Avatar">
        </div>

        <button id="startButton">Start Game</button>
    </div>

    <script src="../assets/js/arrowFront.js"></script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script> 
</body>
