<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Wheel Game</title>
    <link rel="stylesheet" href="../assets/css/s.css">
    <script src="../assets/js/s.js" defer></script>
</head>
<body>
    <div id="container">
        <div id="wheel-container">
            <img src="../assets/images/spi!.png" alt="Spin the Wheel" id="wheel-image">
            <img src="../assets/images/arrow.png" alt="Arrow" id="arrow-image">
            <button id="spin-button">SPIN</button>
            <div id="result" class="hidd n">spin the wheel to select the segment</div>
        </div>
        <div id="constitution-container">
            <img src="../assets/images/constitution.png" alt="Indian Constitution" id="constitution-image">
        </div>
    </div>
        
    <!-- Instructions Popup -->
    <div id="instructions-popup" class="instructions-popup">
        <img src="../assets/images/press start.png" alt="Instructions" class="instructions-image">
    </div>

    <!-- Audio elements for sound effects -->
    <audio id="animation-sound" src="../assets/songs/animation-sound.mp3"></audio>
    <div id="google_translate_element"></div>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
