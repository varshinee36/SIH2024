<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Quiz Game</title>
    <link rel="stylesheet" href="../assets/css/piccq.css">
</head>
<body>
    <div id="google_translate_element"></div>
    <div class="container">
        <!-- Game Container -->
        <div class="game-container">
            <div class="scoreboard">
                <div id="score">Score: 0</div>
                <div id="correct">Correct Answers: 0</div>
                <div id="wrong">Wrong Answers: 0</div>
            </div>

            <div id="text-prompt" class="text-prompt"></div>
            <div id="article-part" class="article-box"></div>
            <div class="image-container">
                <div class="image-option" id="option1"></div>
                <div class="image-option" id="option2"></div>
                <div class="image-option" id="option3"></div>
                <div class="image-option" id="option4"></div>
            </div>
            <div class="analog-timer-container">
                <div class="analog-timer">
                    <div id="timer-pointer" class="timer-pointer"></div>
                </div>
                <div id="timer-label">Time Left: 30s</div>
            </div>

            <div id="result"></div>

            <button id="next-question" class="btn" style="display:none;" onclick="nextQuestion()">Next Question</button>

            <div id="popup" class="popup">
                <div id="popupMessage"></div>
            </div>

            <div id="explanation" class="explanation">
                <p id="explanationText"></p>
                <button class="btn" onclick="closeExplanation()">Close</button>
            </div>

            <div id="vertical-frame" style="display:none;">
                <video id="feedback-video" controls>
                    <source id="video-source" type="video/mp4">
                </video>
                <button id="skipVideoButton" class="btn" onclick="skipVideo()">Skip</button>
            </div>
        </div>

        <!-- Result Section -->
        <div id="result-section" class="hide">
            <h1>Quiz Result</h1>
            <div id="result-details">
                <!-- Result details will be dynamically added here -->
            </div>
            <button class="btn" id="restart-btn" style="display: none;" onclick="restartQuiz()">Restart Quiz</button>
            <button class="btn" id="next-level-btn" style="display: none;" onclick="proceedToNextLevel()">Proceed to Round 4</button>
            <!-- Avatar in Result -->
            <img id="resultAvatar" src="../assets/images/avatar.png" alt="Result Avatar" class="result-avatar">
        </div>
    </div>

    <script src="../assets/js/piccq.js"></script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script> 
</body>
</html>
