<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connection Quiz Game Instructions</title>
    <link rel="stylesheet" href="../assets/css/piccqFront.css">
</head>
<body>
    <div id="google_translate_element"></div>
    <div id="instruction-container" class="instruction-container">
        <div class="instruction-box">
            <h3>Instructions</h3>
            <p>Welcome to the Connection Quiz Game!</p>
            <ul>
                <li>Answer the questions within the given time limit.</li>
                <li>Try to score as high as possible.</li>
                <li>You can only move to the next question after answering.</li>
            </ul>
            <button id="startQuizButton" class="btn">Start Quiz</button>
        </div>

        <div id="avatar-container">
            <img id="avatar" src="../assets/images/avatar.png" alt="Avatar Image" class="avatar">
        </div>
    </div>

    <script src="../assets/js/piccqFront.js"></script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script> 
</body>
</html>
